[tools]
clojure = "latest"
java = "temurin-25"

[tasks.test]
description = "Run tests"
run = "clojure -M:test"

[tasks.update-deps]
description = "Check for outdated dependencies"
run = "clojure -M:dev/outdated"

[tasks.clean]
description = "Clean build artifacts"
run = "clojure -T:build clean"

[tasks.jar]
description = "Build jar (set SNAPSHOT=true for snapshot build)"
run = "clojure -T:build jar :snapshot ${SNAPSHOT:-false}"

[tasks.publish]
description = "Publish jar (set SNAPSHOT=true for snapshot build)"
run = "clojure -T:build publish :snapshot ${SNAPSHOT:-false}"
depends = ["clean", "jar"]

[tasks.release]
description = "Clean, build jar, and publish"
depends = ["publish"]

[tasks.install]
description = "Install jar locally (set SNAPSHOT=true for snapshot build)"
run = "clojure -T:build install :snapshot ${SNAPSHOT:-false}"
depends = ["jar"]
